<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion Runtime transition / presence</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, sans-serif;
    background: #10131b;
    color: white;
  }
  main { width: min(520px, calc(100vw - 32px)); }
  .card {
    padding: 28px;
    border-radius: 28px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(24px) saturate(1.25);
  }
  button {
    margin-top: 18px;
    border: 0;
    border-radius: 999px;
    padding: 11px 18px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
</style>
<main>
  <article class="card" id="card">
    <h2>Interrupt me</h2>
    <p>Toggle rapidly. Enter/exit retarget the same numeric values, so velocity is preserved.</p>
  </article>
  <button id="toggle">Show / hide</button>
</main>
<script type="module">
  import { motionValue, spring } from '../../src/index.js';
  import { bindMotionStyles } from '../../src/dom/index.js';
  import { createPresence, createTransition } from '../../src/transition/index.js';

  const card = document.querySelector('#card');
  const opacity = motionValue(0);
  const y = motionValue(18);
  const scale = motionValue(0.965);
  bindMotionStyles(card, { opacity, y, scale });

  const transition = createTransition([
    { key: 'opacity', target: opacity, from: 0, to: 1 },
    { key: 'y', target: y, from: 18, to: 0 },
    { key: 'scale', target: scale, from: 0.965, to: 1 },
  ], {
    present: false,
    enter: spring({ response: 0.34, dampingRatio: 0.82 }),
    exit: spring({ response: 0.24, dampingRatio: 0.9 }),
  });

  const presence = createPresence(transition, {
    onRenderChange(rendered) { card.hidden = !rendered; },
  });
  card.hidden = !presence.rendered;

  document.querySelector('#toggle').onclick = () => {
    presence.setPresent(!presence.present);
  };
</script>
