<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Motion Runtime Demo</title>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; font-family: system-ui; background: #111; }
    #box { width: 96px; height: 96px; border-radius: 28px; background: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="box"></div>
  <script type="module">
    import { motionValue, animate, smooth, bouncy } from '../../src/index.js';
    import { bindMotionStyles } from '../../src/dom/index.js';
    const box = document.querySelector('#box');
    const x = motionValue(-180);
    const scale = motionValue(1);
    bindMotionStyles(box, { x, scale });
    let right = false;
    box.addEventListener('click', () => {
      right = !right;
      animate(x, right ? 180 : -180, smooth());
      animate(scale, right ? 1.18 : 1, bouncy());
    });
  </script>
</body>
</html>
