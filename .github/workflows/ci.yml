name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue:
          - '3.3.13'
          - '^3'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Select Vue compatibility target
        run: npm install --no-save --force "vue@${{ matrix.vue }}"
      - run: npm test
