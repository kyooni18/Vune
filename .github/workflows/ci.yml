name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18.3.1, 19.2.8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select React compatibility version
        run: >-
          pnpm add --save-dev --ignore-scripts
          react@${{ matrix.react }}
          react-dom@${{ matrix.react }}
          ${{ matrix.react == '18.3.1' && '@types/react@18.3.23 @types/react-dom@18.3.7' || '@types/react@19.2.18 @types/react-dom@19.2.4' }}
      - run: pnpm test
      - run: pnpm run demo:build
      - run: pnpm run demo:vue:build
      - run: pnpm run demo:web:build
      - run: pnpm run demo:parity:build
      - run: pnpm run demo:showcase:build

  browser:
    name: Browser interaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build production browser fixtures
        run: pnpm run demo:all:build
      - name: Validate production browser fixtures
        run: pnpm run test:browser:built
      - name: Start demo server
        run: pnpm exec vite --config examples/vite.config.ts --host 127.0.0.1 > vune-vite.log 2>&1 &
      - name: Start Vue demo server
        run: pnpm exec vite --config examples/vue.vite.config.ts --host 127.0.0.1 --port 5175 > vune-vue-vite.log 2>&1 &
      - name: Start Web demo server
        run: pnpm exec vite --config examples/web.vite.config.ts --host 127.0.0.1 --port 5174 > vune-web-vite.log 2>&1 &
      - name: Start parity React server
        run: pnpm exec vite --config examples/parity-react.vite.config.ts --host 127.0.0.1 --port 5180 > vune-parity-react.log 2>&1 &
      - name: Start parity Vue server
        run: pnpm exec vite --config examples/parity-vue.vite.config.ts --host 127.0.0.1 --port 5181 > vune-parity-vue.log 2>&1 &
      - name: Start parity Web server
        run: pnpm exec vite --config examples/parity-web.vite.config.ts --host 127.0.0.1 --port 5182 > vune-parity-web.log 2>&1 &
      - name: Start Showcase server
        run: pnpm exec vite --config examples/showcase.vite.config.ts --host 127.0.0.1 --port 5183 > vune-showcase-vite.log 2>&1 &
      - name: Wait for renderer demo servers
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:5175/vue-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5174/web-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5180/parity-react-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5181/parity-vue-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5182/parity-web-index.html >/dev/null \
              && curl --fail --silent http://127.0.0.1:5183/showcase-index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat vune-vite.log
          cat vune-vue-vite.log
          cat vune-web-vite.log
          cat vune-parity-react.log
          cat vune-parity-vue.log
          cat vune-parity-web.log
          cat vune-showcase-vite.log
          exit 1
      - run: VUNE_BROWSER_URL=http://127.0.0.1:5173 pnpm run test:browser
      - run: VUNE_VUE_BROWSER_URL=http://127.0.0.1:5175/vue-index.html pnpm run test:browser:vue
      - run: VUNE_WEB_BROWSER_URL=http://127.0.0.1:5174/web-index.html pnpm run test:browser:web
      - run: VUNE_PARITY_REACT_URL=http://127.0.0.1:5180/parity-react-index.html VUNE_PARITY_VUE_URL=http://127.0.0.1:5181/parity-vue-index.html VUNE_PARITY_WEB_URL=http://127.0.0.1:5182/parity-web-index.html pnpm run test:browser:parity
      - run: VUNE_SHOWCASE_URL=http://127.0.0.1:5183/showcase-index.html pnpm run test:browser:showcase

  benchmark:
    name: Modifier benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run benchmark:modifiers:ci
      - name: Run performance benchmark
        run: pnpm run benchmark:performance:ci
