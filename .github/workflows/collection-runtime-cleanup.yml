name: Collection runtime cleanup

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0

      - name: Wait for the validated product commit
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/collection-runtime-finalize-20260830'
          found=false
          for _ in $(seq 1 300); do
            git fetch origin "$branch"
            if git log --format=%s -50 "origin/$branch" | grep -Fxq 'perf: finalize collection runtime hot paths'; then
              found=true
              break
            fi
            sleep 15
          done
          if [ "$found" != true ]; then
            echo 'Validated collection runtime commit did not appear.' >&2
            exit 1
          fi
          git reset --hard "origin/$branch"

      - name: Remove temporary collection diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/collection-state-hotpath.mjs \
            .github/collection-state-hotpath.patch \
            .github/collection-runtime.patch \
            .github/collection-runtime-part2.patch \
            .github/collection-runtime-part3.patch \
            .github/collection-runtime-part4.patch \
            .github/collection-runtime-part5.patch \
            .github/collection-runtime-finalize.patch.gz.b64.* \
            .github/workflows/collection-runtime-finalize.yml \
            .github/workflows/collection-runtime-validate.yml \
            .github/workflows/collection-runtime-cleanup.yml
          if find .github -maxdepth 2 -type f \
              \( -name '*collection-runtime*' -o -name '*collection-state-hotpath*' \) \
              -print -quit | grep -q .; then
            echo 'A temporary collection diagnostic file remains under .github.' >&2
            find .github -maxdepth 2 -type f -print >&2
            exit 1
          fi
          git add -A .github
          git diff --cached --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'No temporary diagnostics remain.'
            exit 0
          fi
          git commit -m 'chore: remove collection runtime diagnostics'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
