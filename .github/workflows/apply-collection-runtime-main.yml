name: Validate collection runtime architecture

on:
  push:
    branches:
      - automation/collection-runtime-validation

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Apply collection runtime patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/patches/collection-runtime/*.patch; do
            case "$patch" in
              *13-o0o0o-public-api.patch) continue ;;
            esac
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck core
        run: pnpm exec tsc --noEmit --project packages/core/tsconfig.json

      - name: Run full test suite
        run: pnpm test

      - name: Run package semantic tests
        run: |
          node --test \
            tests/core-package.test.mjs \
            tests/compiler-package.test.mjs \
            tests/compiler-parity-package.test.mjs \
            tests/compiler-cross-target-package.test.mjs \
            tests/react-package.test.mjs \
            tests/vue-package.test.mjs \
            tests/web-package.test.mjs \
            tests/ssr-package.test.mjs

      - name: Build packages
        run: pnpm build

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .github/patches/collection-runtime
          git rm .github/workflows/apply-collection-runtime-main.yml
          git add packages tests
          git commit -m 'Implement persistent keyed collection runtime'
          git push origin HEAD:automation/collection-runtime-validation
