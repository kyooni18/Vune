name: Collection runtime final verification

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collection-runtime-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'fix collection web hot path'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: mkdir -p validation-output
      - name: Fix generic keyed events and eventful collection fallback expectations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before)
            if (first < 0) throw new Error(`missing ${label}`)
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`ambiguous ${label}`)
            return source.slice(0, first) + after + source.slice(first + before.length)
          }
          const webPath = 'packages/web/src/dom.ts'
          let web = fs.readFileSync(webPath, 'utf8')
          web = replaceOnce(web,
            'function directKeyedPatchPropsSafe(props: Record<string, unknown> | null): boolean {',
            'function directKeyedPatchPropsSafe(props: Record<string, unknown> | null, allowEvents = true): boolean {',
            'directKeyedPatchPropsSafe signature')
          web = replaceOnce(web,
            `      // Event listener lifecycle is renderer state, not a data-only host prop.\n      // Keep it on the generic graph path even when a manually supplied\n      // compiled plan happens to return a function.\n      if (/^on[A-Za-z]/.test(key)) return false`,
            `      if (/^on[A-Za-z]/.test(key)) {\n        if (!allowEvents) return false\n        if (value !== undefined && value !== null && typeof value !== "function") return false\n        continue\n      }`,
            'event prop safety branch')
          web = replaceOnce(web,
            '      || !directKeyedPatchPropsSafe(evaluated.props)) return undefined',
            '      || !directKeyedPatchPropsSafe(evaluated.props, false)) return undefined',
            'compiled collection event rejection')
          fs.writeFileSync(webPath, web)
          const testPath = 'tests/web-package.test.mjs'
          let tests = fs.readFileSync(testPath, 'utf8')
          tests = replaceOnce(tests,
            `  assert.equal(items.value[0].calls, 1)\n  assert.equal(parentRuns, 2)\n  assert.equal(genericRows, 2)`,
            `  assert.equal(items.value[0].calls, 1)\n  assert.equal(parentRuns, 1)\n  assert.equal(genericRows, 2)`,
            'eventful click fallback expectations')
          tests = replaceOnce(tests,
            `  assert.equal(container.querySelector("button")?.textContent, "A2")\n  assert.equal(parentRuns, 3)\n  assert.equal(genericRows, 3)`,
            `  assert.equal(container.querySelector("button")?.textContent, "A2")\n  assert.equal(parentRuns, 1)\n  assert.equal(genericRows, 3)`,
            'eventful value fallback expectations')
          fs.writeFileSync(testPath, tests)
          NODE
          git diff --check
      - name: Install dependencies
        shell: bash
        run: set -o pipefail; pnpm install --frozen-lockfile 2>&1 | tee validation-output/install.log
      - name: Build workspace
        shell: bash
        run: set -o pipefail; pnpm run build 2>&1 | tee validation-output/build.log
      - name: State core tests
        shell: bash
        run: set -o pipefail; node --test tests/core.test.mjs 2>&1 | tee validation-output/state-core.log
      - name: Collection-specific Web tests
        shell: bash
        run: >-
          set -o pipefail; node --test
          --test-name-pattern='row-local invalidation|flat keyed host rows|batches in-place ForEach mutations|compiled keyed collection|eventful compiled collection|push pop and reverse|duplicate occurrence identity'
          tests/web-package.test.mjs 2>&1 | tee validation-output/web-collection.log
      - name: Compiler tests
        shell: bash
        run: set -o pipefail; node --test tests/compiler-package.test.mjs 2>&1 | tee validation-output/compiler.log
      - name: React and Vue collection adapter tests
        shell: bash
        run: >-
          set -o pipefail; node --test
          --test-name-pattern='compiler-planned State collections|collection fallback keeps source'
          tests/react-client.test.mjs tests/vue-live.test.mjs 2>&1 | tee validation-output/adapters.log
      - name: Full Web package tests
        shell: bash
        run: set -o pipefail; node --test tests/web-package.test.mjs 2>&1 | tee validation-output/web-full.log
      - name: Full test suite
        shell: bash
        run: set -o pipefail; pnpm test 2>&1 | tee validation-output/pnpm-test.log
      - name: Current 25k collection benchmark
        shell: bash
        run: set -o pipefail; node benchmarks/collection-runtime.mjs 2>&1 | tee validation-output/current-benchmark.json
      - name: Checkpoint 25k collection benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/vune-checkpoint 71010c2b1c45ff5994eb6561d97e5e406e249d39
          cleanup() { git worktree remove --force /tmp/vune-checkpoint >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          (
            cd /tmp/vune-checkpoint
            set -o pipefail
            pnpm install --frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/validation-output/checkpoint-install.log"
            pnpm run build 2>&1 | tee "$GITHUB_WORKSPACE/validation-output/checkpoint-build.log"
            node benchmarks/collection-runtime.mjs 2>&1 | tee "$GITHUB_WORKSPACE/validation-output/checkpoint-benchmark.json"
          )
      - name: Write validation summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const checkpoint = JSON.parse(fs.readFileSync('validation-output/checkpoint-benchmark.json', 'utf8'))
          const current = JSON.parse(fs.readFileSync('validation-output/current-benchmark.json', 'utf8'))
          const keys = ['mountMs', 'replaceOneMs', 'mutateOneMs', 'pushOneMs', 'popOneMs', 'reverseMs']
          const benchmark = Object.fromEntries(keys.map(key => [key, { checkpoint: checkpoint[key], current: current[key], changePercent: Number((((current[key] / checkpoint[key]) - 1) * 100).toFixed(1)) }]))
          fs.writeFileSync('validation-output/summary.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, checkpointSha: '71010c2b1c45ff5994eb6561d97e5e406e249d39', tests: { build: 'passed', stateCore: 'passed', webCollection: 'passed', compiler: 'passed', adapters: 'passed', webFull: 'passed', pnpmTest: 'passed' }, benchmark }, null, 2) + '\n')
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-runtime-final-validation
          path: validation-output
          retention-days: 3
          if-no-files-found: warn
      - name: Commit validated fixes and remove diagnostics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/web/src/dom.ts tests/web-package.test.mjs
          while IFS= read -r -d '' path; do git rm -r -f --ignore-unmatch -- "$path"; done < <(find .github -mindepth 1 -maxdepth 1 -name 'collection-*' -print0)
          while IFS= read -r -d '' path; do git rm -f --ignore-unmatch -- "$path"; done < <(find .github/workflows -mindepth 1 -maxdepth 1 -name 'collection-runtime-*.yml' -print0)
          git diff --cached --check
          git commit -m 'perf: finalize collection runtime hot paths'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
