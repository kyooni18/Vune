name: Debug collection evaluation

on:
  push:
    branches:
      - automation/collection-runtime-source

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Trace persistent collection row evaluation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/web-package.test.mjs')
          text = path.read_text()
          marker = 'test("@vune-ui/web executes ForEach host rows persistently and invalidates only changed entries"'
          start = text.index(marker)
          end = text.index('\n})', start)
          section = text[start:end]
          section = section.replace('rowRuns += 1', 'rowRuns += 1; console.trace(`row-eval:${item.id}:run:${rowRuns}`)', 1)
          path.write_text(text[:start] + section + text[end:])
          PY
          node --test --test-name-pattern='executes ForEach host rows persistently' tests/web-package.test.mjs
