name: Collection runtime live-key recovery

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

jobs:
  recover-key-metadata:
    if: contains(github.event.head_commit.message, 'recover flat keyed live metadata')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install and test current target
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
          pattern='row-local invalidation|flat keyed host rows|batches in-place ForEach mutations|compiled keyed collection|eventful compiled collection|push pop and reverse|duplicate occurrence identity'
          if node --test --test-name-pattern="$pattern" tests/web-package.test.mjs > /tmp/current-target.log 2>&1; then
            cat /tmp/current-target.log
            printf 'current-target=pass\n' > .github/collection-key-recovery-pass.txt
            exit 0
          fi
          cat /tmp/current-target.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('packages/web/src/dom.ts')
          text = path.read_text()

          start = text.find('function patchFlatKeyedHostBoundary(')
          if start < 0:
              raise SystemExit('patchFlatKeyedHostBoundary not found')
          brace = text.find('{', start)
          depth = 0
          end = None
          for index in range(brace, len(text)):
              if text[index] == '{':
                  depth += 1
              elif text[index] == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          if end is None:
              raise SystemExit('patchFlatKeyedHostBoundary body not closed')

          body = text[start:end]
          pattern = re.compile(r'(?P<indent>\s*)const key = context\.domKeys\.get\((?P<node>[^)]+)\)')
          match = pattern.search(body)
          if match:
              indent = match.group('indent')
              node = match.group('node').strip()
              replacement = (
                  f'{indent}const directKey = context.domKeys.get({node})'
                  f'{indent}const storedProps = {node}.nodeType === 1\n'
                  f'{indent}  ? context.domProps.get({node} as Element)\n'
                  f'{indent}  : undefined\n'
                  f'{indent}const storedKey = storedProps ? ownGraphDataValue(storedProps, "key") : undefined\n'
                  f'{indent}const key = directKey ?? (typeof storedKey === "string" || typeof storedKey === "number"\n'
                  f'{indent}  ? storedKey\n'
                  f'{indent}  : undefined)'
              )
              body = body[:match.start()] + replacement + body[match.end():]
              text = text[:start] + body + text[end:]
          elif 'const storedKey = storedProps ? ownGraphDataValue(storedProps, "key") : undefined' not in body:
              raise SystemExit('live keyed child lookup not found')

          path.write_text(text)
          PY

          git diff --check
          pnpm run build
          if node --test --test-name-pattern="$pattern" tests/web-package.test.mjs > /tmp/recovered-target.log 2>&1; then
            cat /tmp/recovered-target.log
            printf 'key-recovery-target=pass\n' > .github/collection-key-recovery-pass.txt
          else
            cat /tmp/recovered-target.log
            {
              echo 'CURRENT'
              cat /tmp/current-target.log
              echo
              echo 'RECOVERED'
              cat /tmp/recovered-target.log
              echo
              echo 'PATCH'
              git diff -- packages/web/src/dom.ts
            } > .github/collection-key-recovery-failure.txt
            git restore packages/web/src/dom.ts
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f .github/collection-key-recovery-failure.txt
            git commit -m 'chore: record flat keyed metadata recovery failure'
            git push origin HEAD:codex/collection-runtime-finalize-20260830
            exit 1
          fi
      - name: Commit target-green metadata recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/web/src/dom.ts .github/collection-key-recovery-pass.txt
          git commit -m 'fix(web): recover keyed live DOM metadata'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
