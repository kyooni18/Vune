name: Validate collection runtime v2

on:
  push:
    branches:
      - automation/collection-runtime-validation

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply runtime and public API patches
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in .github/patches/collection-runtime/*.patch; do
            echo "Applying $patch_file"
            set +e
            patch -p1 --batch --forward --fuzz=3 < "$patch_file"
            status=$?
            set -e
            rejects=$(find packages tests -name '*.rej' -print)
            if [ -n "$rejects" ]; then
              while IFS= read -r reject; do
                echo "Rejected hunk: $reject"
                cat "$reject"
              done <<< "$rejects"
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "Patch returned $status after applying all hunks; accepting the zero-new-blob deletion warning"
            fi
            find packages tests -name '*.orig' -delete
          done
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/web/src/element-motion.ts')
          text = path.read_text()
          text = text.replace('import { ownStyleAnimation } from "o0o0o/dom"\n', '')
          start = text.index('export interface MotionHandle {')
          end = text.index('interface AnimationTiming {', start)
          replacement = '''export interface MotionHandle {
            readonly finished: Promise<MotionStatus>
            cancel(): void
          }

          const styleAnimationOwners = new WeakMap<Element, Map<string, MotionHandle>>()

          function ownStyleAnimation(element: Element, properties: readonly string[], handle: MotionHandle): void {
            const uniqueProperties = [...new Set(properties)]
            if (uniqueProperties.length === 0) return
            let owners = styleAnimationOwners.get(element)
            if (!owners) {
              owners = new Map()
              styleAnimationOwners.set(element, owners)
            }

            const displaced = new Set<MotionHandle>()
            for (const property of uniqueProperties) {
              const previous = owners.get(property)
              if (previous && previous !== handle) displaced.add(previous)
            }
            for (const previous of displaced) previous.cancel()
            for (const property of uniqueProperties) owners.set(property, handle)

            const release = () => {
              const current = styleAnimationOwners.get(element)
              if (!current) return
              for (const property of uniqueProperties) {
                if (current.get(property) === handle) current.delete(property)
              }
              if (current.size === 0) styleAnimationOwners.delete(element)
            }
            void handle.finished.then(release, release)
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck core
        run: pnpm exec tsc --noEmit --project packages/core/tsconfig.json

      - name: Run full test suite
        run: pnpm test

      - name: Run package semantic tests
        run: |
          node --test \
            tests/core-package.test.mjs \
            tests/compiler-package.test.mjs \
            tests/compiler-parity-package.test.mjs \
            tests/compiler-cross-target-package.test.mjs \
            tests/react-package.test.mjs \
            tests/vue-package.test.mjs \
            tests/web-package.test.mjs \
            tests/ssr-package.test.mjs

      - name: Build packages
        run: pnpm build

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r .github/patches/collection-runtime
          git rm .github/workflows/validate-collection-runtime-v2.yml
          git add packages tests
          git commit -m 'Implement persistent keyed collection runtime'
          git push origin HEAD:automation/collection-runtime-validation
