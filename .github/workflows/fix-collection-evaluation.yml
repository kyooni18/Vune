name: Fix collection evaluation

on:
  push:
    branches:
      - automation/collection-runtime-source

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Preserve lazy graph descriptors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/core/src/graph/modifiers.ts')
          text = path.read_text()
          old = 'const result = Object.assign(Object.create(modifierPrototype), node) as ModifiableViewNode'
          new = 'const result = Object.defineProperties(Object.create(modifierPrototype), Object.getOwnPropertyDescriptors(node)) as ModifiableViewNode'
          if old not in text:
            raise SystemExit('decorate copy expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify persistent collection execution
        run: node --test --test-name-pattern='executes ForEach host rows persistently|batches in-place ForEach mutations|patches flat keyed host rows' tests/web-package.test.mjs
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/debug-collection-evaluation.yml
          rm -f .github/workflows/fix-collection-evaluation.yml
          rm -rf .automation
          git add -A
          git commit -m 'Preserve lazy collection graph descriptors'
          git push origin HEAD:automation/collection-runtime-source
