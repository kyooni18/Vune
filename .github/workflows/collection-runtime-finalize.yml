name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

jobs:
  diagnose-collection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Instrument collection executor
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const viewsPath = 'packages/core/src/views.ts'
          let views = fs.readFileSync(viewsPath, 'utf8')
          views = views.replace('indexIndependent: content.length < 2,', 'indexIndependent: false,')
          fs.writeFileSync(viewsPath, views)

          const domPath = 'packages/web/src/dom.ts'
          let dom = fs.readFileSync(domPath, 'utf8')
          const effectsLine = '  const effects = collectionMutationEffects(instance, node, mutations)\n  const indexIndependent = node.compiled?.indexIndependent ?? node.indexIndependent\n'
          if (!dom.includes(effectsLine)) throw new Error('effects marker missing')
          dom = dom.replace(effectsLine, effectsLine + '  console.log("[collection-diag] patch", { mutations: mutations.map(m => m.kind + ":" + String(m.property ?? m.method ?? "")), forceAll: effects.forceAll, touched: effects.touched.size, entries: entries.length, indexIndependent })\n  let evaluatedCount = 0\n')
          const evaluatedLine = '    const plan = evaluated\n      ? directCollectionHostRow(node, entry)\n'
          if (!dom.includes(evaluatedLine)) throw new Error('evaluated marker missing')
          dom = dom.replace(evaluatedLine, '    if (evaluated) evaluatedCount += 1\n' + evaluatedLine)
          const successLine = '  instance.node = node\n  instance.sourceIdentity = reactiveIdentity(node.source)\n'
          if (!dom.includes(successLine)) throw new Error('success marker missing')
          dom = dom.replace(successLine, '  console.log("[collection-diag] success", { evaluatedCount })\n' + successLine)
          const subLine = '          boundary.pendingTransaction = transaction\n          boundary.pendingMutations.push(...batch.mutations)\n'
          if (!dom.includes(subLine)) throw new Error('subscription marker missing')
          dom = dom.replace(subLine, subLine + '          console.log("[collection-diag] subscription", boundary.key, batch.mutations.map(m => m.kind + ":" + String(m.property ?? m.method ?? "")))\n')
          fs.writeFileSync(domPath, dom)
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node --test --test-name-pattern='executes ForEach host rows persistently' tests/web-package.test.mjs
