name: Export collection runtime workspace

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0
      - name: Package workspace
        run: tar --exclude=.git --exclude=vune-workspace.tar.gz -czf vune-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: vune-workspace
          path: vune-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
