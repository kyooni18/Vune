name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

jobs:
  inspect-compiler-shape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Print transformed collection shapes
        run: |
          node --input-type=module <<'NODE'
          import { transformVuneSource } from './packages/compiler/dist/index.js'
          const plain = 'import { State, Element, ForEach, defineView, initializer } from "@vune-ui/core"\nconst items = State([{ id: "a", value: "A" }])\nexport const App = defineView("App", { initializers: [initializer("App()", args => args.length === 0)], body: () => Element("section", null, ForEach(items.value, item => Element("span", { title: item.value }, item.value))) })'
          const builder = 'import { State, Element, ForEach } from "@vune-ui/core"\nconst items = State([{ id: "a", value: "A" }])\nVStack() { ForEach(items, key: item => item.id) { item in Element("span", { title: item.value }, item.value) } }'
          console.log('--- plain ---')
          console.log(transformVuneSource(plain, 'plain.vune.ts'))
          console.log('--- builder ---')
          console.log(transformVuneSource(builder, 'builder.vune.ts'))
          NODE
