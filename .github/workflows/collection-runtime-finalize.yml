name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

jobs:
  trace-collection-owned-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Escape staged compiler template literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/collection-runtime-finalize.mjs')
          source = path.read_text()
          for name in [
              'plan.itemName', 'plan.indexName', 'compiled.content.getText(sourceFile)',
              'plan.indexIndependent', 'parameters', 'plan.typeSource', 'plan.propsSource', 'plan.textSource',
              'rowPlan.itemName', 'rowPlan.indexName', 'keyPlan.source', 'rowPlan.indexIndependent',
              'compiledKey', 'rowPlan.typeSource', 'rowPlan.propsSource', 'rowPlan.textSource',
          ]:
              source = source.replace('${' + name + '}', r'\${' + name + '}')
          path.write_text(source)
          PY
      - run: node .github/collection-runtime-finalize.mjs
      - name: Import helper and instrument collection lifetime
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const testPath = 'tests/web-package.test.mjs'
          let test = fs.readFileSync(testPath, 'utf8')
          test = test.replace('  compiledTemplate,\n  defineCompiledTemplate,', '  compiledTemplate,\n  compiledCollectionContent,\n  defineCompiledTemplate,')
          fs.writeFileSync(testPath, test)

          const path = 'packages/web/src/dom.ts'
          let source = fs.readFileSync(path, 'utf8')
          source = source.replace('function disposeDomCollection(runtime: DomViewRuntime, key: string): void {\n  const instance = runtime.collections.get(key)', 'function disposeDomCollection(runtime: DomViewRuntime, key: string): void {\n  console.log("[collection-life] dispose", key)\n  const instance = runtime.collections.get(key)')
          source = source.replace('function registerDomCollection(runtime: DomViewRuntime, instance: DomCollectionInstance): void {\n  disposeDomCollection(runtime, instance.key)', 'function registerDomCollection(runtime: DomViewRuntime, instance: DomCollectionInstance): void {\n  console.log("[collection-life] register", instance.key, instance.ownerKey)\n  disposeDomCollection(runtime, instance.key)')
          source = source.replace('function subscribeDomCollection(instance: DomCollectionInstance, context: DomRenderContext, runtime: DomViewRuntime): void {\n  if (!isStateRef(instance.node.source) || !instance.node.compiled?.evaluateKey) return', 'function subscribeDomCollection(instance: DomCollectionInstance, context: DomRenderContext, runtime: DomViewRuntime): void {\n  console.log("[collection-life] subscribe-attempt", instance.key, isStateRef(instance.node.source), Boolean(instance.node.compiled?.evaluateKey), runtime.collections.get(instance.key) === instance)\n  if (!isStateRef(instance.node.source) || !instance.node.compiled?.evaluateKey) return')
          source = source.replace('  instance.unsubscribe = subscribeState(source, (transaction, batch) => {\n    if (runtime.collections.get(instance.key) !== instance) return', '  instance.unsubscribe = subscribeState(source, (transaction, batch) => {\n    console.log("[collection-life] callback", instance.key, runtime.collections.get(instance.key) === instance, batch.mutations.map(m => m.kind + ":" + String(m.property ?? m.method ?? "")))\n    if (runtime.collections.get(instance.key) !== instance) return')
          source = source.replace('  registerDomCollection(runtime, instance)\n  subscribeDomCollection(instance, context, runtime)', '  registerDomCollection(runtime, instance)\n  subscribeDomCollection(instance, context, runtime)\n  console.log("[collection-life] installed", key, Boolean(instance.unsubscribe))')
          fs.writeFileSync(path, source)
          NODE
      - run: pnpm run build
      - run: node --test --test-name-pattern='compiled keyed collection own' tests/web-package.test.mjs
