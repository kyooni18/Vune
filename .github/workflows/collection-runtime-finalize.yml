name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

jobs:
  diagnose-foreach-callers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make generic ForEach conservative
        run: node -e "const fs=require('fs');const p='packages/core/src/views.ts';let s=fs.readFileSync(p,'utf8');s=s.replace('indexIndependent: content.length < 2,','indexIndependent: false,');fs.writeFileSync(p,s)"
      - run: pnpm run build
      - name: Trace callback callers
        run: |
          node --input-type=module <<'NODE'
          import { JSDOM } from 'jsdom'
          import { Element, ForEach, State, defineView, initializer } from './packages/core/dist/index.js'
          import { mount } from './packages/web/dist/index.js'
          const dom = new JSDOM('<div id=app></div>')
          const container = dom.window.document.querySelector('#app')
          const items = State([{ id: 'a', value: 'A' }, { id: 'b', value: 'B' }, { id: 'c', value: 'C' }])
          let rowRuns = 0
          const App = defineView('DiagCollectionCallers', {
            initializers: [initializer('DiagCollectionCallers()', args => args.length === 0)],
            body: () => Element('section', null, ForEach(items.value, item => {
              rowRuns += 1
              console.log('[caller]', rowRuns, item.id, new Error().stack?.split('\n').slice(1, 7).join(' <- '))
              return Element('span', { 'data-row': item.id }, item.value)
            })),
          })
          const unmount = mount(App(), container)
          console.log('[fixture] initial', rowRuns)
          rowRuns = 0
          const changed = [...items.value]
          changed[1] = { ...changed[1], value: 'B1' }
          items.value = changed
          await Promise.resolve(); await Promise.resolve()
          console.log('[fixture] single', rowRuns)
          unmount(); dom.window.close()
          NODE
