name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

jobs:
  validate-compiler-collection-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire compiler collection pass
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'packages/compiler/src/pipeline.ts'
          let source = fs.readFileSync(path, 'utf8')
          const importMarker = 'import { foldStaticResults, hoistStaticViewSubtrees, lowerCompiledViewTemplates, lowerStaticSemanticSpecializations, staticModifierNames } from "./specialization.js"\n'
          if (!source.includes(importMarker)) throw new Error('specialization import marker missing')
          source = source.replace(importMarker, importMarker + 'import { lowerCompiledCollections } from "./collection-specialization.js"\n')
          const helpers = 'const required = ["defineView", "initializer", "resolveBuilderInput", "namedArguments", "overloadClosure", "Binding", "State", "Element", "modifiedContent", "modifiedContentCompiled", "compiledTemplate", "defineCompiledTemplate"]'
          if (!source.includes(helpers)) throw new Error('runtime helper marker missing')
          source = source.replace(helpers, 'const required = ["defineView", "initializer", "resolveBuilderInput", "namedArguments", "overloadClosure", "Binding", "State", "Element", "modifiedContent", "modifiedContentCompiled", "compiledTemplate", "defineCompiledTemplate", "compiledCollectionContent"]')
          const pass = '  const withSemanticSpecializations = lowerStaticSemanticSpecializations(withStaticStructCalls, fileName)\n  const withCompiledTemplates = lowerCompiledViewTemplates(withSemanticSpecializations)\n'
          if (!source.includes(pass)) throw new Error('compiler pass marker missing')
          source = source.replace(pass, '  const withSemanticSpecializations = lowerStaticSemanticSpecializations(withStaticStructCalls, fileName)\n  const withCompiledCollections = lowerCompiledCollections(withSemanticSpecializations)\n  const withCompiledTemplates = lowerCompiledViewTemplates(withCompiledCollections)\n')
          fs.writeFileSync(path, source)
          NODE
      - name: Add compiler regressions
        run: |
          cat >> tests/compiler-package.test.mjs <<'EOF'

          test("compiler emits direct collection row plans only for proven flat host rows", () => {
            const source = `import { State, Element, ForEach, defineView, initializer } from "@vune-ui/core"
          const items = State([{ id: "a", value: "A" }])
          export const App = defineView("App", { initializers: [initializer("App()", args => args.length === 0)], body: () => Element("section", null, ForEach(items.value, item => Element("span", { title: item.value }, item.value))) })`
            const output = transformVuneSource(source, "CompiledCollection.vune.ts")
            assert.match(output, /compiledCollectionContent\(item => Element\("span"/)
            assert.match(output, /kind: "flat-text-host", indexIndependent: true/)
            assert.match(output, /evaluate: \(item\) => \(\{ type: "span", props: \{ title: item\.value \}, text: item\.value \}\)/)
            assert.match(output, /import \{[^}]*compiledCollectionContent[^}]*\} from "@vune-ui\/core"/)
            assert.equal(ts.createSourceFile("CompiledCollection.ts", output, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS).parseDiagnostics.length, 0)
          })

          test("compiler keeps index-sensitive collection plans conservative", () => {
            const source = `import { State, Element, ForEach, defineView, initializer } from "@vune-ui/core"
          const items = State([{ id: "a", value: "A" }])
          export const App = defineView("App", { initializers: [initializer("App()", args => args.length === 0)], body: () => Element("section", null, ForEach(items.value, (item, index) => Element("span", { title: item.value }, String(index) + ":" + item.value))) })`
            const output = transformVuneSource(source, "IndexedCompiledCollection.vune.ts")
            assert.match(output, /compiledCollectionContent/)
            assert.match(output, /indexIndependent: false/)
          })

          test("compiler refuses effectful or structurally complex collection rows", () => {
            const effectful = `import { State, Element, ForEach, defineView, initializer } from "@vune-ui/core"
          const items = State([{ id: "a", value: "A" }])
          const format = value => value.toUpperCase()
          export const App = defineView("App", { initializers: [initializer("App()", args => args.length === 0)], body: () => Element("section", null, ForEach(items.value, item => Element("span", { title: format(item.value) }, item.value))) })`
            assert.doesNotMatch(transformVuneSource(effectful, "EffectfulCollection.vune.ts"), /compiledCollectionContent/)

            const nested = `import { State, Element, ForEach, defineView, initializer } from "@vune-ui/core"
          const items = State([{ id: "a", value: "A" }])
          export const App = defineView("App", { initializers: [initializer("App()", args => args.length === 0)], body: () => Element("section", null, ForEach(items.value, item => Element("span", null, Element("strong", null, item.value)))) })`
            assert.doesNotMatch(transformVuneSource(nested, "NestedCollection.vune.ts"), /compiledCollectionContent/)
          })
          EOF
      - run: pnpm run build
      - run: node --test --test-name-pattern='collection row plans|collection plans conservative|collection rows' tests/compiler-package.test.mjs
      - run: node --test --test-name-pattern='ForEach' tests/web-package.test.mjs
      - name: Commit validated compiler pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/compiler/src/collection-specialization.ts packages/compiler/src/pipeline.ts tests/compiler-package.test.mjs
          git commit -m 'Compile proven ForEach rows to direct collection plans'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
