name: Collection Runtime Finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

jobs:
  validate-collection-key-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/collection-key-index.mjs
      - run: pnpm run build
      - run: node --test --test-name-pattern='push pop and reverse|compiled keyed collection own' tests/web-package.test.mjs
      - run: node benchmarks/collection-runtime.mjs
      - name: Commit validated key index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/web/src/dom.ts benchmarks/collection-runtime.mjs
          git commit -m 'Keep compiled collection key index persistent'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
