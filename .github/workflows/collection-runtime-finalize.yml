name: Collection runtime baseline diagnostic

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: read

jobs:
  baseline-web:
    if: contains(github.event.head_commit.message, 'check collection web baseline')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71010c2b1c45ff5994eb6561d97e5e406e249d39
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install and build checkpoint
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Run checkpoint collection-specific Web tests
        run: |
          node --test \
            --test-name-pattern='flat keyed host rows|eventful compiled collection' \
            tests/web-package.test.mjs
