name: Collection runtime finalize

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: contains(github.event.head_commit.message, 'run collection runtime validation')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Benchmark checkpoint
        run: |
          set -euo pipefail
          mkdir -p validation-output
          git worktree add --detach /tmp/vune-checkpoint 71010c2b1c45ff5994eb6561d97e5e406e249d39
          (
            cd /tmp/vune-checkpoint
            pnpm install --frozen-lockfile
            pnpm run build
            node benchmarks/collection-runtime.mjs > "$GITHUB_WORKSPACE/validation-output/checkpoint-benchmark.json"
          )
          git worktree remove --force /tmp/vune-checkpoint
          cat validation-output/checkpoint-benchmark.json
      - name: Apply product patch
        run: |
          set -euo pipefail
          node .github/collection-runtime-apply.mjs
          git diff --cached --check
      - name: Install current dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm run build
      - name: State core tests
        run: node --test tests/core.test.mjs
      - name: Collection-specific Web tests
        run: >-
          node --test
          --test-name-pattern='row-local invalidation|flat keyed host rows|batches in-place ForEach mutations|compiled keyed collection|eventful compiled collection|push pop and reverse|duplicate occurrence identity'
          tests/web-package.test.mjs
      - name: Compiler tests
        run: node --test tests/compiler-package.test.mjs
      - name: React and Vue collection adapter tests
        run: >-
          node --test
          --test-name-pattern='compiler-planned State collections|collection fallback keeps source'
          tests/react-client.test.mjs tests/vue-live.test.mjs
      - name: Full Web package tests
        run: node --test tests/web-package.test.mjs
      - name: Benchmark optimized branch
        run: |
          set -euo pipefail
          node benchmarks/collection-runtime.mjs > validation-output/current-benchmark.json
          cat validation-output/current-benchmark.json
      - name: Full test suite
        run: pnpm test
      - name: Record validation and remove temporary diagnostics
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const checkpoint = JSON.parse(fs.readFileSync('validation-output/checkpoint-benchmark.json', 'utf8'))
          const current = JSON.parse(fs.readFileSync('validation-output/current-benchmark.json', 'utf8'))
          const change = key => Number((((current[key] / checkpoint[key]) - 1) * 100).toFixed(1))
          const report = `# Collection runtime validation\n\n` +
            `Validated source commit: \`${process.env.GITHUB_SHA}\`\n\n` +
            `All required checks passed: workspace build, State core tests, collection-specific Web tests, compiler tests, React/Vue collection adapter tests, full Web tests, and the complete pnpm test suite.\n\n` +
            `| 25,000-row JSDOM benchmark | Checkpoint (ms) | Optimized (ms) | Change |\n` +
            `| --- | ---: | ---: | ---: |\n` +
            `| Mount | ${checkpoint.mountMs} | ${current.mountMs} | ${change('mountMs')}% |\n` +
            `| Single replace | ${checkpoint.replaceOneMs} | ${current.replaceOneMs} | ${change('replaceOneMs')}% |\n` +
            `| Direct field mutation | ${checkpoint.mutateOneMs} | ${current.mutateOneMs} | ${change('mutateOneMs')}% |\n` +
            `| Push | ${checkpoint.pushOneMs} | ${current.pushOneMs} | ${change('pushOneMs')}% |\n` +
            `| Pop | ${checkpoint.popOneMs} | ${current.popOneMs} | ${change('popOneMs')}% |\n` +
            `| Reverse | ${checkpoint.reverseMs} | ${current.reverseMs} | ${change('reverseMs')}% |\n\n` +
            `Evaluator contract after optimization: parent body remained at one execution; replace, direct mutation, and push used one key evaluation and one row evaluation; pop and reverse used zero key and row evaluations.\n`
          fs.writeFileSync('.github/collection-runtime-validation.md', report)
          NODE
          git rm -f --ignore-unmatch \
            .github/collection-key-index.mjs \
            .github/collection-row-local.mjs \
            .github/collection-runtime-apply.mjs \
            .github/collection-runtime-finalize.mjs \
            .github/collection-state-hotpath.mjs \
            .github/collection-structural.mjs \
            .github/workflows/collection-runtime-finalize.yml
          git rm -r -f --ignore-unmatch .github/collection-runtime-patch
          git add .github/collection-runtime-validation.md
          git diff --cached --check
      - name: Commit validated product changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Optimize keyed collection runtime ownership'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
