name: Collection runtime source fix final

on:
  push:
    branches:
      - codex/collection-runtime-finalize-20260830

permissions:
  contents: write

concurrency:
  group: collection-runtime-source-fix-final
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip source-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/collection-runtime-finalize-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Fix collection fast-path eligibility and generic fallback ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(source: str, before: str, after: str, label: str) -> str:
            count = source.count(before)
            if count == 1:
              return source.replace(before, after, 1)
            if count == 0 and after in source:
              return source
            raise SystemExit(f'{label}: expected one match, found {count}')

          path = Path('packages/web/src/dom.ts')
          source = path.read_text()

          source = replace_once(
            source,
            'function directKeyedPatchPropsSafe(props: Record<string, unknown> | null): boolean {',
            'function directKeyedPatchPropsSafe(props: Record<string, unknown> | null, allowEvents = true): boolean {',
            'direct keyed prop predicate signature',
          )

          old_event = '''      // Event listener lifecycle is renderer state, not a data-only host prop.
                // Keep it on the generic graph path even when a manually supplied
                // compiled plan happens to return a function.
                if (/^on[A-Za-z]/.test(key)) return false
          '''
          new_event = '''      // Raw keyed-host patching owns listener lifecycle through patchDomProps.
                // Compiler-owned collection executors stay data-only so a runtime plan
                // that produces effects falls back to the generic renderer instead.
                if (/^on[A-Za-z]/.test(key)) {
                  if (!allowEvents) return false
                  if (value !== undefined && value !== null && typeof value !== "function") return false
                  continue
                }
          '''
          source = replace_once(source, old_event, new_event, 'event prop safety branch')

          source = replace_once(
            source,
            '      || !directKeyedPatchPropsSafe(evaluated.props)) return undefined',
            '      || !directKeyedPatchPropsSafe(evaluated.props, false)) return undefined',
            'compiled collection prop predicate',
          )

          source = replace_once(
            source,
            '  renderedBody: boolean\n}',
            '  renderedBody: boolean\n  dynamicDependencies: boolean\n}',
            'boundary dynamic dependency field',
          )

          source = replace_once(
            source,
            '        renderedBody: true,\n      }',
            '        renderedBody: true,\n        dynamicDependencies: false,\n      }',
            'boundary dynamic dependency initialization',
          )

          source = replace_once(
            source,
            '    const declared = node.dependencies\n',
            '    boundary.dynamicDependencies = false\n    const declared = node.dependencies\n',
            'boundary dependency proof reset',
          )

          source = replace_once(
            source,
            '        dependency => { if (!(declared && node.dependenciesComplete === true)) dependencies.add(dependency) },',
            '''        dependency => {
                  if (!(declared && node.dependenciesComplete === true) || boundary.dynamicDependencies) dependencies.add(dependency)
                },''',
            'dynamic dependency collection',
          )

          source, count = re.subn(
            r'(?m)^(\s*)registerGenericStateCollection\(node, identity, ownerKey, context, runtime\)$',
            r'\1if (node.compiled?.evaluateKey) owner.dynamicDependencies = true',
            source,
            count=1,
          )
          if count != 1:
            raise SystemExit(f'generic collection ownership handoff: expected one call, found {count}')

          source = source.replace(
            '        // Candidate fallback rendering suppresses direct DOM ownership, but a\n'
            '        // compiler-isolated State source still needs a fresh invalidation\n'
            '        // subscription after the previous executor is discarded.\n',
            '        // A compiled collection normally isolates its source dependency inside\n'
            '        // the direct executor. Once rendering falls back to the generic graph,\n'
            '        // that compiler proof no longer applies: let the owning View collect\n'
            '        // the source and row reads through the normal dependency collector.\n',
            1,
          )

          pattern = re.compile(
            r'function registerGenericStateCollection\(.*?\n}\n\n(?=function collectionMutationEffects\()',
            re.S,
          )
          source, count = pattern.subn('', source, count=1)
          if count != 1:
            raise SystemExit(f'generic collection helper removal: expected one match, found {count}')

          path.write_text(source)
          PY
          git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm run build
      - name: State core tests
        run: node --test tests/core.test.mjs
      - name: Collection-specific Web tests
        shell: bash
        run: |
          node --test \
            --test-name-pattern='row-local invalidation|flat keyed host rows|batches in-place ForEach mutations|compiled keyed collection|eventful compiled collection|push pop and reverse|duplicate occurrence identity' \
            tests/web-package.test.mjs
      - name: Compiler tests
        run: node --test tests/compiler-package.test.mjs
      - name: React and Vue collection adapter tests
        shell: bash
        run: |
          node --test \
            --test-name-pattern='collection|ForEach|keyed' \
            tests/react-client.test.mjs tests/vue-live.test.mjs
      - name: Full Web package tests
        run: node --test tests/web-package.test.mjs
      - name: Full test suite
        run: pnpm test

      - name: Benchmark checkpoint and optimized branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vune-validation
          git worktree add --detach /tmp/vune-checkpoint 71010c2b1c45ff5994eb6561d97e5e406e249d39
          cleanup() { git worktree remove --force /tmp/vune-checkpoint >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          (
            cd /tmp/vune-checkpoint
            pnpm install --frozen-lockfile
            pnpm run build
            node benchmarks/collection-runtime.mjs > /tmp/vune-validation/checkpoint.json
          )
          git worktree remove --force /tmp/vune-checkpoint
          trap - EXIT
          node benchmarks/collection-runtime.mjs > /tmp/vune-validation/optimized.json
          cat /tmp/vune-validation/checkpoint.json
          cat /tmp/vune-validation/optimized.json

      - uses: actions/upload-artifact@v4
        with:
          name: collection-runtime-final-evidence
          path: /tmp/vune-validation
          retention-days: 3
          if-no-files-found: error

      - name: Commit validated product tree and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git diff -- packages/web/src/dom.ts > /tmp/collection-source-fix.patch
          git reset --hard HEAD
          git clean -fd
          git fetch origin codex/collection-runtime-finalize-20260830
          product_changes=$(git diff --name-only HEAD..origin/codex/collection-runtime-finalize-20260830 | grep -v '^\.github/' || true)
          if [ -n "$product_changes" ]; then
            echo 'Product files changed while validation was running:' >&2
            echo "$product_changes" >&2
            exit 1
          fi
          git rebase origin/codex/collection-runtime-finalize-20260830
          git apply /tmp/collection-source-fix.patch
          while IFS= read -r -d '' path; do
            git rm -r -f --ignore-unmatch -- "$path"
          done < <(find .github -mindepth 1 -maxdepth 1 -name 'collection-*' -print0)
          while IFS= read -r -d '' path; do
            git rm -f --ignore-unmatch -- "$path"
          done < <(find .github/workflows -mindepth 1 -maxdepth 1 -name 'collection-*' -print0)
          git rm -f --ignore-unmatch .github/workflows/runtime-regression-fix.yml
          if git ls-files '.github/**' | grep -E '(^\.github/collection-|^\.github/workflows/collection-|^\.github/workflows/runtime-regression-fix\.yml$)'; then
            echo 'Temporary collection diagnostics remain after cleanup.' >&2
            exit 1
          fi
          checkpoint=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('/tmp/vune-validation/checkpoint.json','utf8'))))")
          optimized=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('/tmp/vune-validation/optimized.json','utf8'))))")
          git add packages/web/src/dom.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit \
            -m 'perf: finalize collection runtime hot paths [skip source-fix]' \
            -m "checkpoint-benchmark=$checkpoint" \
            -m "optimized-benchmark=$optimized" \
            -m 'validation=build,state-core,collection-web,compiler,react-vue,full-web,pnpm-test'
          git push origin HEAD:codex/collection-runtime-finalize-20260830
