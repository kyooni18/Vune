name: Apply runtime main patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct keyed collection patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/vune-runtime-direct-main.patch ]; then
            echo 'patch already consumed'
            exit 0
          fi
          git apply --check .github/vune-runtime-direct-main.patch
          git apply .github/vune-runtime-direct-main.patch
          rm -f .github/vune-runtime-direct-main.patch
          rm -f .github/workflows/apply-runtime-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Extend direct keyed runtime to append and remove'
          git push origin HEAD:main
